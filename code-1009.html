<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多功能一數：百位合成學習機</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang TC', sans-serif;
    }
    body {
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    /* 整體雙欄佈局 */
    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* 左側：進度對照列表 */
    .list-card {
      background: #f0fdf4;
      border: 3px solid #86efac;
      border-radius: 20px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }
    .list-card h2 {
      margin-top: 0;
      font-size: 20px;
      color: #166534;
      text-align: center;
      border-bottom: 2px dashed #bbf7d0;
      padding-bottom: 10px;
    }
    .step-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      margin-bottom: 6px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #334155;
      background-color: rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }
    /* 當前激活/亮燈的列表行 */
    .step-item.active {
      background-color: #fef08a;
      border: 2px solid #eab308;
      color: #854d0e;
      transform: scale(1.03);
      box-shadow: 0 4px 8px rgba(234, 179, 8, 0.3);
    }
    .step-item .val-box {
      min-width: 50px;
      text-align: right;
      color: #ea580c;
    }

    /* 右側：主遊戲區 */
    .game-card {
      background: white;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      flex: 1;
      min-width: 340px;
    }

    /* 模式選擇器 (20, 25, 50, 100) */
    .mode-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 50px;
    }
    .mode-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #0284c7;
      color: white;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }

    /* 頂部算式展示區 */
    .formula-box {
      background: linear-gradient(135deg, #fef08a, #fde047);
      border: 4px solid #eab308;
      border-radius: 20px;
      padding: 12px 15px;
      margin: 10px 0 20px 0;
      box-shadow: 0 6px 12px rgba(234, 179, 8, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 32px;
      font-weight: 900;
      color: #1e293b;
    }
    .highlight-count {
      color: #d97706;
      font-size: 42px;
    }
    .highlight-total {
      color: #2563eb;
      font-size: 45px;
    }

    /* 遊戲畫板 */
    .board {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      min-height: 180px;
      background-color: #f8fafc;
      border: 3px dashed #cbd5e1;
      border-radius: 16px;
      padding: 15px;
      margin: 15px 0;
    }
    
    /* 基本單位小方塊樣式 */
    .block-unit {
      width: 65px;
      height: 65px;
      background-color: #38bdf8;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 100 可愛大眼百位方塊樣式 */
    .block-100 {
      width: 110px;
      height: 110px;
      background-color: #fbbf24;
      border: 4px solid #f59e0b;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(245, 158, 11, 0.3);
      animation: mergeTransform 0.5s ease-out;
    }
    .eyes {
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
    }
    .eye {
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #1e293b;
      border-radius: 50%;
    }
    .mouth {
      width: 12px;
      height: 6px;
      border-bottom: 3px solid #78350f;
      border-radius: 0 0 10px 10px;
      margin-bottom: 2px;
    }
    .block-100-val {
      font-size: 20px;
      font-weight: bold;
      color: #78350f;
    }

    /* 按鈕樣式 */
    .btn-container {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button.btn-act {
      font-size: 20px;
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-add {
      background-color: #22c55e;
      color: white;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
    }
    .btn-add:hover { background-color: #16a34a; }
    .btn-reset {
      background-color: #ef4444;
      color: white;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
    }
    .btn-reset:hover { background-color: #dc2626; }
    button:active { transform: scale(0.95); }

    /* 動畫效果 */
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes mergeTransform {
      0% { transform: scale(0.8) rotate(-5deg); }
      50% { transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- 左側：1-12個數的動態對照表 -->
    <div class="list-card">
      <h2>💡 一數記錄表</h2>
      <ul class="step-list" id="step-list">
        <!-- JS 動態生成 1-12 行 -->
      </ul>
    </div>

    <!-- 右側：遊戲主區塊 -->
    <div class="game-card">
      
      <!-- 模式選擇 (20/25/50/100) -->
      <div class="mode-selector">
        <button class="mode-btn" onclick="setStep(20)">20 一數</button>
        <button class="mode-btn active" id="btn-default" onclick="setStep(25)">25 一數</button>
        <button class="mode-btn" onclick="setStep(50)">50 一數</button>
        <button class="mode-btn" onclick="setStep(100)">100 一數</button>
      </div>

      <h1 id="game-title">🎲 25 一數：百位合成</h1>
      
      <!-- 顯眼算式區 -->
      <div class="formula-box">
        <span class="highlight-count" id="count-val">0</span> 個 <span id="unit-val-text">25</span> 是 <span class="highlight-total" id="total-val">0</span>
      </div>

      <!-- 圖形合成展示畫板 -->
      <div class="board" id="board"></div>

      <!-- 控制按鈕 -->
      <div class="btn-container">
        <button class="btn-act btn-add" id="btn-add-text" onclick="addStep()">+ 25</button>
        <button class="btn-act btn-reset" onclick="resetGame()">重新開始</button>
      </div>

    </div>

  </div>

  <script>
    let stepUnit = 25;   // 當前一數的單位 (預設 25)
    let currentCount = 0; // 目前加了幾多次

    // 初始化/切換單位模式
    function setStep(unit) {
      stepUnit = unit;
      currentCount = 0;

      // 更新 UI 模式按鈕樣式
      const btns = document.querySelectorAll('.mode-btn');
      btns.forEach(btn => {
        btn.classList.remove('active');
        if(btn.innerText.includes(unit)) btn.classList.add('active');
      });

      // 更新文字與標題
      document.getElementById('game-title').innerText = `🎲 ${stepUnit} 一數：百位合成`;
      document.getElementById('unit-val-text').innerText = stepUnit;
      document.getElementById('btn-add-text').innerText = `+ ${stepUnit}`;

      renderList();
      updateDisplay();
    }

    // 生成左側對照列表 (1 到 12 個)
    function renderList() {
      const listContainer = document.getElementById('step-list');
      listContainer.innerHTML = '';

      for (let i = 1; i <= 12; i++) {
        const li = document.createElement('li');
        li.className = 'step-item';
        li.id = `step-item-${i}`;
        
        const targetVal = i * stepUnit;
        li.innerHTML = `
          <span>${i} 個 ${stepUnit} 是</span>
          <span class="val-box">${targetVal}</span>
        `;
        listContainer.appendChild(li);
      }
    }

    // 按下 + 按鈕
    function addStep() {
      if (currentCount < 12) { // 上限 12 個
        currentCount++;
        updateDisplay();
      }
    }

    // 重設
    function resetGame() {
      currentCount = 0;
      updateDisplay();
    }

    // 更新整體畫面顯示
    function updateDisplay() {
      const totalVal = currentCount * stepUnit;

      // 1. 更新頂部算式
      document.getElementById('count-val').innerText = currentCount;
      document.getElementById('total-val').innerText = totalVal;

      // 2. 更新左側列表高亮
      for (let i = 1; i <= 12; i++) {
        const item = document.getElementById(`step-item-${i}`);
        if (i === currentCount) {
          item.classList.add('active');
          // 自動滾動使當前激活行可見
          item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          item.classList.remove('active');
        }
      }

      // 3. 更新畫板方塊合成
      const board = document.getElementById('board');
      board.innerHTML = '';

      if (totalVal === 0) return;

      // 計算可合成多少個 100，以及剩餘多少個基礎單位
      const count100 = Math.floor(totalVal / 100);
      const remainder = totalVal % 100;
      const countUnits = remainder / stepUnit;

      // 生成 100 大眼合成方塊
      for (let i = 1; i <= count100; i++) {
        const block100 = document.createElement('div');
        block100.className = 'block-100';
        block100.innerHTML = `
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
          <div class="block-100-val">100</div>
        `;
        board.appendChild(block100);
      }

      // 生成未滿 100 的基礎小方塊
      for (let i = 1; i <= countUnits; i++) {
        const blockUnit = document.createElement('div');
        blockUnit.className = 'block-unit';
        blockUnit.innerText = stepUnit;
        board.appendChild(blockUnit);
      }
    }

    // 初始載入
    setStep(25);
  </script>
</body>
</html>
