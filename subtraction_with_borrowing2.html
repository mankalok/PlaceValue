<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小二數學：兩位數退位減法（直觀簡化版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      touch-action: manipulation;
    }

    /* 3D 數粒風格 - 修復 iPad 拉長問題 */
    .rod-ten {
      width: 22px;
      height: 150px !important; /* 強制固定高度，防止 iPad Flexbox 拉伸 */
      max-height: 150px !important;
      min-height: 150px !important;
      background: #2ecc71;
      border: 2px solid #27ae60;
      border-radius: 6px;
      box-shadow: inset -2px 0 0 #1e8449, 2px 3px 6px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0 !important;
    }
    .rod-ten:active { transform: scale(0.95); }
    .rod-seg {
      height: 14.6px;
      border-bottom: 1px solid #1e8449;
      box-sizing: border-box;
    }
    .rod-seg:last-child {
      border-bottom: none;
    }

    .cube-unit {
      width: 22px;
      height: 22px !important;
      max-height: 22px !important;
      min-height: 22px !important;
      background: #f1c40f;
      border: 2px solid #d4ac0d;
      border-radius: 4px;
      box-shadow: inset -1px -1px 0 #b7950b, 1px 2px 4px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cube-unit:active { transform: scale(0.9); }

    /* 被劃掉/減去的狀態 */
    .removed-item {
      opacity: 0.25;
      filter: grayscale(100%);
      position: relative;
    }
    .removed-item::after {
      content: '✕';
      color: #ef4444;
      font-weight: 900;
      font-size: 18px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 拆解動畫 */
    .decomposing-rod {
      animation: decomposeAnim 0.6s forwards ease-in-out;
    }
    @keyframes decomposeAnim {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.1) rotate(15deg); background: #f97316; }
      100% { transform: scale(0) rotate(45deg); opacity: 0; }
    }

    /* 直式對齊風格 */
    .vertical-grid {
      display: grid;
      grid-template-columns: 2.5rem 3.5rem 3.5rem;
      row-gap: 0.2rem;
      align-items: center;
      justify-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    /* 劃掉效果（斜線） */
    .strikethrough {
      position: relative;
      color: #94a3b8;
    }
    .strikethrough::after {
      content: '';
      position: absolute;
      left: 10%;
      top: 50%;
      width: 80%;
      height: 3px;
      background-color: #ef4444;
      transform: rotate(-25deg);
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen pb-6">

  <!-- 頂部簡潔控制列 -->
  <header class="bg-indigo-600 text-white w-full py-3 px-4 shadow-md flex items-center justify-between max-w-4xl rounded-b-2xl">
    <div class="flex items-center gap-2">
      <span class="text-xl font-bold">題目：</span>
      <input type="number" id="numMinuend" value="31" min="11" max="99" onchange="applyCustomProblem()" class="w-16 p-1 text-center text-xl font-extrabold text-indigo-900 border-2 border-indigo-200 rounded-lg outline-none">
      <span class="text-2xl font-bold">-</span>
      <input type="number" id="numSubtrahend" value="25" min="1" max="98" onchange="applyCustomProblem()" class="w-16 p-1 text-center text-xl font-extrabold text-indigo-900 border-2 border-indigo-200 rounded-lg outline-none">
    </div>

    <div class="flex gap-2">
      <button onclick="startAutoDemo()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-sm transition shadow flex items-center gap-1">
        ▶️ 演示
      </button>
      <button onclick="generateRandomProblem()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-sm transition shadow flex items-center gap-1">
        🎲 換題
      </button>
      <button onclick="resetApp()" class="bg-indigo-500 hover:bg-indigo-400 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-sm transition shadow">
        🔄 重來
      </button>
    </div>
  </header>

  <main class="w-full max-w-4xl px-3 flex flex-col md:flex-row gap-4 mt-4 items-start">

    <!-- 左邊：直式區域 -->
    <div class="w-full md:w-5/12 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col items-center justify-center min-h-[360px]">
      <div class="vertical-grid text-3xl font-extrabold text-slate-800">
        <!-- 位值標題 -->
        <div></div>
        <div class="text-base font-bold text-emerald-600 border-b-2 border-emerald-100 w-full text-center pb-1">十位</div>
        <div class="text-base font-bold text-amber-600 border-b-2 border-amber-100 w-full text-center pb-1">個位</div>

        <!-- 退位標記行 -->
        <div></div>
        <div id="vBorrowTen" class="text-red-500 text-xl font-bold h-7 flex items-center justify-center"></div>
        <div id="vBorrowUnit" class="text-red-500 text-xl font-bold h-7 flex items-center justify-center"></div>

        <!-- 被減數 -->
        <div></div>
        <div id="vMinuendTen">3</div>
        <div id="vMinuendUnit">1</div>

        <!-- 減號與減數 -->
        <div class="text-slate-600 text-2xl font-bold">-</div>
        <div id="vSubtrahendTen" class="text-slate-700">2</div>
        <div id="vSubtrahendUnit" class="text-slate-700">5</div>

        <!-- 橫線 -->
        <div class="col-span-3 w-full border-b-4 border-slate-800 my-1"></div>

        <!-- 答案行 -->
        <div></div>
        <div id="vAnsTen" class="text-indigo-600 text-4xl font-extrabold h-10 flex items-center justify-center">?</div>
        <div id="vAnsUnit" class="text-indigo-600 text-4xl font-extrabold h-10 flex items-center justify-center">?</div>
      </div>

      <div id="statusHint" class="mt-4 px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 text-center">
        👉 點擊綠色十位棒退位拆開
      </div>
    </div>

    <!-- 右邊：數粒操作區 -->
    <div class="w-full md:w-7/12 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between min-h-[360px]">
      
      <div class="grid grid-cols-2 gap-3 h-full">
        <!-- 十位區 -->
        <div class="bg-slate-50 border-2 border-dashed border-emerald-200 rounded-xl p-3 flex flex-col items-center justify-start min-h-[300px]">
          <div class="text-xs font-bold text-emerald-700 mb-2">十位棒 (10)</div>
          <div id="tenRodsContainer" class="flex flex-wrap gap-2 justify-center items-end w-full min-h-[160px]"></div>
        </div>

        <!-- 個位區 -->
        <div class="bg-slate-50 border-2 border-dashed border-amber-200 rounded-xl p-3 flex flex-col items-center justify-start min-h-[300px]">
          <div class="text-xs font-bold text-amber-700 mb-2">個位數粒 (1)</div>
          <div id="unitCubesContainer" class="flex flex-wrap gap-2 justify-center items-start content-start w-full max-w-[200px]"></div>
        </div>
      </div>

    </div>

  </main>

  <script>
    let minuend = 31;
    let subtrahend = 25;

    let currentTens = 3;
    let currentUnits = 1;
    let isDecomposed = false;

    let removedUnits = 0;
    let removedTens = 0;

    let isAnimating = false;

    window.onload = function() {
      resetApp();
    };

    function generateRandomProblem() {
      if (isAnimating) return;
      let mT = Math.floor(Math.random() * 5) + 3; // 3 ~ 7
      let mU = Math.floor(Math.random() * 4);      // 0 ~ 3
      let sT = Math.floor(Math.random() * (mT - 1)) + 1;
      let sU = Math.floor(Math.random() * (9 - (mU + 1) + 1)) + (mU + 1);

      let newM = mT * 10 + mU;
      let newS = sT * 10 + sU;

      document.getElementById('numMinuend').value = newM;
      document.getElementById('numSubtrahend').value = newS;
      applyCustomProblem();
    }

    function applyCustomProblem() {
      if (isAnimating) return;
      let m = parseInt(document.getElementById('numMinuend').value) || 0;
      let s = parseInt(document.getElementById('numSubtrahend').value) || 0;

      if (m <= s) {
        alert('被減數必須大於減數（結果不能為 0 或負數）！');
        document.getElementById('numMinuend').value = minuend;
        document.getElementById('numSubtrahend').value = subtrahend;
        return;
      }

      if (m > 99 || s < 1) {
        alert('請輸入 1 至 99 之間的數字！');
        document.getElementById('numMinuend').value = minuend;
        document.getElementById('numSubtrahend').value = subtrahend;
        return;
      }

      minuend = m;
      subtrahend = s;
      resetApp();
    }

    function resetApp() {
      isAnimating = false;
      currentTens = Math.floor(minuend / 10);
      currentUnits = minuend % 10;
      isDecomposed = false;
      removedUnits = 0;
      removedTens = 0;

      // 清除劃線效果與還原數字
      document.getElementById('vMinuendTen').innerText = currentTens;
      document.getElementById('vMinuendTen').classList.remove('strikethrough');
      document.getElementById('vMinuendUnit').innerText = currentUnits;
      document.getElementById('vMinuendUnit').classList.remove('strikethrough');

      document.getElementById('vSubtrahendTen').innerText = Math.floor(subtrahend / 10);
      document.getElementById('vSubtrahendUnit').innerText = subtrahend % 10;

      document.getElementById('vBorrowTen').innerText = '';
      document.getElementById('vBorrowUnit').innerText = '';

      document.getElementById('vAnsTen').innerText = '?';
      document.getElementById('vAnsUnit').innerText = '?';

      let reqUnits = subtrahend % 10;
      let origUnits = minuend % 10;
      if (origUnits < reqUnits) {
        document.getElementById('statusHint').innerText = '👉 點擊綠色十位棒退位拆開';
        document.getElementById('statusHint').className = 'mt-4 px-4 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 text-center';
      } else {
        document.getElementById('statusHint').innerText = '👉 點擊黃色數粒劃掉減去';
        document.getElementById('statusHint').className = 'mt-4 px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 text-center';
      }

      renderManipulatives();
    }

    function renderManipulatives() {
      // 渲染十位棒
      const tenContainer = document.getElementById('tenRodsContainer');
      tenContainer.innerHTML = '';
      for (let i = 0; i < currentTens; i++) {
        let rod = document.createElement('div');
        rod.className = 'rod-ten';
        if (i < removedTens) rod.classList.add('removed-item');
        for (let j = 0; j < 10; j++) {
          let seg = document.createElement('div');
          seg.className = 'rod-seg';
          rod.appendChild(seg);
        }
        rod.onclick = () => onRodClick(i);
        tenContainer.appendChild(rod);
      }

      // 渲染個位數粒
      const unitContainer = document.getElementById('unitCubesContainer');
      unitContainer.innerHTML = '';
      for (let i = 0; i < currentUnits; i++) {
        let cube = document.createElement('div');
        cube.className = 'cube-unit';
        if (i < removedUnits) cube.classList.add('removed-item');
        cube.onclick = () => onCubeClick(i);
        unitContainer.appendChild(cube);
      }
    }

    /* 點擊十位棒 */
    function onRodClick(index) {
      if (isAnimating) return;

      let reqUnits = subtrahend % 10;
      let origUnits = minuend % 10;

      if (!isDecomposed && origUnits < reqUnits) {
        decomposeTen();
        return;
      }

      if (removedUnits >= reqUnits && removedTens < Math.floor(subtrahend / 10)) {
        removedTens++;
        renderManipulatives();
        checkProgress();
      }
    }

    /* 點擊個位數粒 */
    function onCubeClick(index) {
      if (isAnimating) return;
      let reqUnits = subtrahend % 10;
      let origUnits = minuend % 10;

      if (origUnits < reqUnits && !isDecomposed) {
        document.getElementById('statusHint').innerText = '⚠️ 個位不夠減！請先點擊綠色十位棒退位！';
        return;
      }

      if (removedUnits < reqUnits) {
        removedUnits++;
        renderManipulatives();
        checkProgress();
      }
    }

    /* 退位動作：同時劃掉十位與個位的被減數 */
    function decomposeTen(callback) {
      if (isDecomposed || isAnimating) return;
      isAnimating = true;

      const tenContainer = document.getElementById('tenRodsContainer');
      if (tenContainer.lastElementChild) {
        tenContainer.lastElementChild.classList.add('decomposing-rod');
      }

      // 十位與個位同時加上劃線效果
      document.getElementById('vMinuendTen').classList.add('strikethrough');
      document.getElementById('vMinuendUnit').classList.add('strikethrough');

      // 顯示退位後的新數值
      document.getElementById('vBorrowTen').innerText = currentTens - 1;
      document.getElementById('vBorrowUnit').innerText = currentUnits + 10;

      setTimeout(() => {
        currentTens -= 1;
        currentUnits += 10;
        isDecomposed = true;
        isAnimating = false;

        document.getElementById('statusHint').innerText = `👉 請點擊黃色數粒劃掉 ${subtrahend % 10} 個`;
        renderManipulatives();
        if (callback) callback();
      }, 600);
    }

    function checkProgress() {
      let reqUnits = subtrahend % 10;
      let reqTens = Math.floor(subtrahend / 10);

      if (removedUnits === reqUnits && document.getElementById('vAnsUnit').innerText === '?') {
        document.getElementById('vAnsUnit').innerText = currentUnits - removedUnits;
        if (removedTens < reqTens) {
          document.getElementById('statusHint').innerText = `👉 請點擊綠色十位棒劃掉 ${reqTens} 條`;
        }
      }

      if (removedTens === reqTens && document.getElementById('vAnsTen').innerText === '?') {
        let ansTen = currentTens - removedTens;
        // 【修正核心】若十位相減為 0，直式答案不顯示 0，留空處理
        document.getElementById('vAnsTen').innerText = (ansTen === 0) ? '' : ansTen;
      }

      if (removedUnits === reqUnits && removedTens === reqTens) {
        document.getElementById('statusHint').innerText = `🎉 計算完成！答案是 ${minuend - subtrahend}`;
        document.getElementById('statusHint').className = 'mt-4 px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 text-center';
      }
    }

    /* 動態演示 */
    function startAutoDemo() {
      if (isAnimating) return;
      resetApp();

      let reqUnits = subtrahend % 10;
      let reqTens = Math.floor(subtrahend / 10);
      let origUnits = minuend % 10;

      let stepDelay = 300;

      if (origUnits < reqUnits) {
        setTimeout(() => {
          decomposeTen(() => {
            // 劃掉個位
            let uInterval = setInterval(() => {
              if (removedUnits < reqUnits) {
                removedUnits++;
                renderManipulatives();
                checkProgress();
              } else {
                clearInterval(uInterval);
                // 劃掉十位
                setTimeout(() => {
                  let tInterval = setInterval(() => {
                    if (removedTens < reqTens) {
                      removedTens++;
                      renderManipulatives();
                      checkProgress();
                    } else {
                      clearInterval(tInterval);
                    }
                  }, stepDelay);
                }, 400);
              }
            }, stepDelay);
          });
        }, 400);
      }
    }
  </script>
</body>
</html>
